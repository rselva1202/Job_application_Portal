<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 2.5rem 0; }
        .job-card { transition: transform 0.2s, shadow 0.2s; border: none; border-radius: 10px; }
        .job-card:hover { transform: translateY(-3px); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important; }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-briefcase-fill me-2"></i>JobPortal</a>
            <div class="d-flex gap-2">
                <a href="/applied-jobs" class="btn btn-outline-light btn-sm"><i class="bi bi-check2-circle me-1"></i>Applied Jobs</a>
                <a href="/add-job" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle me-1"></i>Post Job</a>
                <a href="/login" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
            </div>
        </div>
    </nav>

    <!-- Hero Banner -->
    <div class="hero-section mb-4 text-center">
        <div class="container">
            <h1 class="fw-bold mb-2">Find Your Dream Job</h1>
            <p class="lead opacity-75">Discover top opportunities across leading companies</p>
            
            <!-- Search Bar -->
            <form action="/dashboard" method="get" class="row justify-content-center g-2 mt-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="keyword" class="form-control form-control-lg" placeholder="Search by job title or location...">
                        <button type="submit" class="btn btn-light text-primary fw-bold">Search</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-secondary">Available Openings</h4>
            <a href="/dashboard" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset List</a>
        </div>

        <!-- Job Table -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Job Title</th>
                                <th>Company</th>
                                <th>Location</th>
                                <th>Salary</th>
                                <th>Description</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="job : ${jobs}">
                                <td>
                                    <div class="fw-bold text-dark" th:text="${job.title}">Title</div>
                                </td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary border fw-medium" th:text="${job.companyName}">Company</span>
                                </td>
                                <td>
                                    <span class="text-muted"><i class="bi bi-geo-alt me-1"></i><span th:text="${job.location}">Location</span></span>
                                </td>
                                <td>
                                    <span class="text-success fw-bold">₹<span th:text="${job.salary}">0</span></span>
                                </td>
                                <td>
                                    <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${job.description}">Description</small>
                                </td>
                                <td>
                                    <div class="d-flex justify-content-center gap-1">
                                        <a th:href="@{/apply-job/{id}(id=${job.id})}" class="btn btn-sm btn-success px-3"><i class="bi bi-send me-1"></i>Apply</a>
                                        <a th:href="@{/edit-job/{id}(id=${job.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                        <a th:href="@{/delete-job/{id}(id=${job.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this job listing?')"><i class="bi bi-trash"></i></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
